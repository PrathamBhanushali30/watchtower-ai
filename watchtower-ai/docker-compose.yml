version: "3.8"
services:
  api:
    build: ./backend
    container_name: watchtower-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://watchtower:watchpass@db:5432/watchtower
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=models
      - SECRET_KEY=change-me
    depends_on:
      - db
      - minio

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchpass
      POSTGRES_DB: watchtower
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

volumes:
  db_data:
  minio_data:
